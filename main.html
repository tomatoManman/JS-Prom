<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/styles.css">
    <title>Document</title>
</head>
<script src="/script.js"></script>
<body>
    <div id="stack">
        <div id="pictures-slideshow" class="panel">
            <div class="left">
                <div id="title" class="container">
                    <p>Welcome to</p>
                    <p id="Prom-name">Rêveuse</p>
                    <p>The Night the Flowers Remembered</p>
                </div>
                <div class="container">
                    <p>Save the date</p>
                    <p>February 20, 2026</p>
                </div>
            </div>
            <div class="scroll-down">
                <p>Scroll for more---></p>
            </div>
        </div>
        <div class="panel">
            <div id="navbar">
                <button data-target="event">EVENT</button>
                <button data-target="venue">VENUE</button>  
                <button data-target="gallery">GALLERY</button>
                <button data-target="contact">CONTACT</button>
            </div>
            <div id="content">
                <div class="panel" id="event">Welcome to the Prom!
                    <p></p>
                </div>
                <div class="panel" id="venue" style="display:none;">Event Details Here</div>
                <div class="panel" id="gallery" style="display:none;">About the Theme</div>
                <div class="panel" id="contact" style="display:none;">Contact Info</div>
            </div>
        </div>
    </div>
</body>
</html>
